services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reshare
      POSTGRES_USER: reshare
      POSTGRES_PASSWORD: local_only_password
    ports:
      - "5432:5432"
    volumes:
      - reshare_pg:/var/lib/postgresql/data
      - ./backend/db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./backend/db/seed-demo.sql:/docker-entrypoint-initdb.d/002_seed-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reshare -d reshare"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://reshare:local_only_password@db:5432/reshare
      DB_SSL: "false"
      AUTH_MODE: local
      JWT_SECRET: local-only-reshare-secret-change-before-any-deployment-2026
      ALLOWED_ORIGINS: http://localhost:5173
      S3_BUCKET: ""
      AWS_REGION: ap-south-1
      SQS_DELIVERY_QUEUE_URL: ""
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000
        VITE_AUTH_MODE: local
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  reshare_pg:
